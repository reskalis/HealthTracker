name: Vendor Whisper WASM

on:
  push:
    paths:
      - ".github/workflows/vendor-whisper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download pinned browser runtime
        run: |
          set -euo pipefail
          rm -rf /tmp/whisper-pkg vendor/whisper-wasm
          mkdir -p /tmp/whisper-pkg vendor/whisper-wasm
          npm pack @timur00kh/whisper.wasm@0.1.0 --pack-destination /tmp/whisper-pkg
          tar -xzf /tmp/whisper-pkg/*.tgz -C /tmp/whisper-pkg
          cp -R /tmp/whisper-pkg/package/dist/. vendor/whisper-wasm/
          cp /tmp/whisper-pkg/package/LICENSE vendor/whisper-wasm/LICENSE
          printf '%s\n' '0.1.0' > vendor/whisper-wasm/VERSION
      - name: Commit vendored runtime
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/whisper-wasm
          if git diff --cached --quiet; then
            echo "Vendored runtime already matches pinned version."
            exit 0
          fi
          git commit -m "Vendor whisper.wasm 0.1.0 [skip ci]"
          git push
