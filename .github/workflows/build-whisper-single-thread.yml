name: Build upstream Whisper WASM

on:
  push:
    paths:
      - ".github/workflows/build-whisper-single-thread.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build pinned upstream whisper.cpp browser runtime
        run: |
          set -euo pipefail

          UPSTREAM_COMMIT="6e4ab854f67f743900934a703d5603419384c961"
          rm -rf /tmp/whisper.cpp vendor/whisper-upstream

          git clone https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          git -C /tmp/whisper.cpp checkout "$UPSTREAM_COMMIT"

          docker run --rm \
            -v /tmp/whisper.cpp:/src/whisper.cpp \
            -w /src/whisper.cpp \
            emscripten/emsdk:4.0.14 \
            bash -lc '
              set -euo pipefail
              rm -rf build-em
              mkdir build-em
              cd build-em
              emcmake cmake .. -DWHISPER_WASM_SINGLE_FILE=ON
              cmake --build . -j2 --target libmain
            '

          mkdir -p vendor/whisper-upstream

          # The official whisper.wasm example uses this generated browser runtime.
          cp /tmp/whisper.cpp/build-em/bin/whisper.wasm/main.js vendor/whisper-upstream/main.js

          # Pthread builds can emit an external worker helper depending on the
          # Emscripten version. Vendor it when present.
          find /tmp/whisper.cpp/build-em -type f -name '*.worker.js' -exec cp {} vendor/whisper-upstream/ \;

          cp /tmp/whisper.cpp/LICENSE vendor/whisper-upstream/LICENSE
          printf '%s\n' "$UPSTREAM_COMMIT" > vendor/whisper-upstream/REVISION
          printf '%s\n' 'Official whisper.cpp whisper.wasm browser runtime; WASM embedded; pthreads enabled.' > vendor/whisper-upstream/BUILD_INFO.txt

          echo "Vendored files:"
          find vendor/whisper-upstream -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Commit upstream runtime
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/whisper-upstream
          if git diff --cached --quiet; then
            echo "Upstream runtime already matches pinned build."
            exit 0
          fi
          git commit -m "Vendor official whisper.cpp browser runtime [skip ci]"
          git push
