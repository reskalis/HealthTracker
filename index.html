<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <title>HealthTracker</title>
</head>
<body>
  <header>
    <div><small>PRIVATE • LOCAL</small><h1>HealthTracker</h1></div>
    <div class="header-actions"><button id="restore">Restore</button><button id="backup">Export</button></div>
  </header>
  <main>
    <section class="hero">
      <p id="today"></p><h2>How are you doing?</h2>
      <p>Your records stay on this device until you export them.</p>
      <p id="backupStatus" class="backup-status"></p>
    </section>
    <section class="grid">
      <button class="card" data-form="daily"><b>☀️ Daily check-in</b><span>Sleep, quality & energy</span></button>
      <button class="card" data-form="measurement"><b>⚖️ Weight & waist</b><span>Body measurements</span></button>
      <button class="card" data-form="bp"><b>❤️ Blood pressure</b><span>Systolic, diastolic & pulse</span></button>
      <button class="card" data-form="workout"><b>🏋️ Workout</b><span>Type, duration & intensity</span></button>
    </section>
    <section><div class="section-title"><h3>Recent</h3></div><div id="recent" class="list"></div></section>
  </main>
  <dialog id="modal"><form id="entryForm"><div class="sheet"><div class="sheethead"><h2 id="formTitle">Log</h2><button type="button" id="close">×</button></div><div id="fields"></div><button class="save" type="submit">Save entry</button></div></form></dialog>
  <input id="restoreInput" type="file" accept=".csv,text/csv" hidden>
  <div id="toast">Saved</div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
