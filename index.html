<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <title>HealthTracker</title>
</head>
<body>
  <header>
    <div>
      <small>PRIVATE • LOCAL</small>
      <h1>HealthTracker</h1>
    </div>
    <div>
      <button id="import" type="button">Import</button>
      <button id="backup" type="button">Export</button>
      <input id="importFile" type="file" accept=".csv,text/csv" hidden>
    </div>
  </header>

  <main>
    <section class="hero">
      <p id="today"></p>
      <h2>How are you doing?</h2>
      <p>Your records stay on this device until you export them.</p>
    </section>

    <section class="grid" aria-label="Log health data">
      <button class="card" data-form="daily"><b>☀️ Daily check-in</b><span>Sleep, quality &amp; energy</span></button>
      <button class="card" data-form="measurement"><b>⚖️ Weight &amp; waist</b><span>Body measurements</span></button>
      <button class="card" data-form="bp"><b>❤️ Blood pressure</b><span>Systolic, diastolic &amp; pulse</span></button>
      <button class="card" data-form="workout"><b>🏋️ Workout</b><span>Type, duration &amp; intensity</span></button>
    </section>

    <section>
      <div class="section-title">
        <h3>Recent</h3>
        <button id="clear" class="text-button" type="button">Manage</button>
      </div>
      <div id="recent" class="list"></div>
    </section>
  </main>

  <dialog id="modal">
    <form id="entryForm">
      <div class="sheet">
        <div class="sheet-header">
          <h2 id="formTitle">Log</h2>
          <button type="button" id="close" aria-label="Close">×</button>
        </div>
        <div id="fields"></div>
        <button class="save-button" type="submit">Save entry</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite">Saved</div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
